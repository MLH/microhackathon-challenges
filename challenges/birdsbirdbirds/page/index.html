<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BirdsBirdBirds</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.mjs"></script>
</head>

<body>
  <main id="draw-mode" hidden>
    <header class="draw-header">
      <h1>Draw your bird</h1>
      <p class="lead">Draw one bird, big and bold, then press <strong>Save my bird</strong>. Pi takes it from there.</p>
    </header>

    <div class="draw-layout">
      <div class="side-column">
        <div class="toolbar" role="toolbar" aria-label="Drawing tools">
          <fieldset class="tool-group">
            <legend>Colour</legend>
            <div class="swatches" id="swatches"></div>
          </fieldset>

          <fieldset class="tool-group">
            <legend>Pen size</legend>
            <div class="sizes" id="sizes"></div>
          </fieldset>

          <fieldset class="tool-group">
            <legend>Tool</legend>
            <div class="tools">
              <button type="button" class="tool-button" id="pen-button" aria-pressed="true">Pen</button>
              <button type="button" class="tool-button" id="eraser-button" aria-pressed="false">Eraser</button>
            </div>
          </fieldset>

          <div class="tool-group actions">
            <button type="button" class="action-button" id="undo-button" title="Undo (Ctrl+Z or Cmd+Z)" disabled>Undo</button>
            <button type="button" class="action-button" id="clear-button">Clear</button>
          </div>
        </div>

        <div class="save-area">
          <button type="button" class="save-button" id="save-button">Save my bird</button>
          <p class="status" id="status" role="status" aria-live="polite">Pick a colour and start drawing.</p>
        </div>
      </div>

      <div class="canvas-column">
        <div class="canvas-frame">
          <canvas id="drawing" width="512" height="512" aria-label="Drawing canvas"></canvas>
        </div>
      </div>
    </div>
  </main>

  <section id="sky-mode" hidden aria-label="Your bird's flight">
    <div class="stage-frame" id="stage-frame">
      <div class="stage" id="stage">
        <div class="sun"></div>
        <div class="cloud cloud-far cloud-a"></div>
        <div class="cloud cloud-far cloud-b"></div>
        <div class="cloud cloud-far cloud-c"></div>
        <div class="flock" id="flock"></div>
        <div class="cloud cloud-mid cloud-d"></div>
        <svg class="hills" width="1000" height="200" viewBox="0 0 1000 200" aria-hidden="true">
          <path d="M0 118 C125 78 230 98 333 88 C448 76 542 58 667 82 C792 106 896 68 1000 84 L1000 200 L0 200 Z" fill="#b4d3e8"></path>
          <path d="M0 150 C104 120 208 128 313 140 C438 154 521 118 646 124 C771 130 875 150 1000 132 L1000 200 L0 200 Z" fill="#94c79f"></path>
          <circle cx="188" cy="128" r="9" fill="#6fae7c"></circle>
          <circle cx="204" cy="132" r="7" fill="#6fae7c"></circle>
          <circle cx="729" cy="124" r="10" fill="#6fae7c"></circle>
          <path d="M0 182 C146 162 271 170 396 176 C542 184 667 160 813 166 C896 170 958 176 1000 172 L1000 200 L0 200 Z" fill="#6fae7c"></path>
        </svg>
        <svg class="paths" width="1000" height="850" viewBox="0 0 1000 850" aria-hidden="true">
          <defs>
            <mask id="draw-mask" maskUnits="userSpaceOnUse" x="-500" y="-500" width="2000" height="1850">
              <path id="draw-mask-path" class="draw-mask-path" pathLength="1000"></path>
            </mask>
          </defs>
          <path id="ghost-path" class="ghost-path"></path>
          <g id="changed-segments"></g>
          <g mask="url(#draw-mask)">
            <path id="path-shadow" class="path-shadow"></path>
            <path id="path-dots" class="path-dots"></path>
          </g>
        </svg>
        <div class="waypoints" id="waypoints"></div>
        <div class="perch" id="perch">
          <img class="bird perch-bird" id="perch-bird" alt="Your bird, waiting to fly">
          <p class="perch-hint">Tell Pi your bird’s name, where it’s from, and how it should fly.</p>
        </div>
        <div class="flight" id="my-flight" hidden>
          <img class="bird my-bird" id="my-bird" alt="Your bird">
        </div>
      </div>
    </div>

    <p class="chip status-chip"><span class="chip-dot" aria-hidden="true"></span><b>Flight School</b> <em id="status-text">· waiting for Pi’s first sketch</em></p>
    <div class="chip name-chip" id="name-chip" hidden>
      <img class="chip-bird" id="chip-bird" alt="">
    </div>
    <p class="foot" id="flock-note" hidden></p>
  </section>
</body>

</html>
