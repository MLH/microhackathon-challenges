<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Launch Control Travel Desk</title>
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/app.mjs"></script>
  </head>
  <body>
    <header class="masthead">
      <h1>Launch Control <span class="masthead-sub">Travel Desk</span></h1>
      <span id="mode-label" class="mode-label" hidden>demo</span>
    </header>

    <main class="desk">
      <section class="chat" aria-label="Chat with the travel booker">
        <ol id="messages" class="messages" aria-live="polite"></ol>
        <p id="thinking" class="thinking" hidden>The booker is working on it…</p>
        <form id="composer" class="composer">
          <button id="suggestion" class="suggestion" type="button">Round trip to Lisbon, Mar 12–16, flight + hotel near the water, under $900 total.</button>
          <div class="composer-row">
            <label class="visually-hidden" for="message">Message the travel booker</label>
            <textarea id="message" rows="2" maxlength="1000" placeholder="Tell the booker about your trip…"></textarea>
            <button id="send" type="submit">Send</button>
          </div>
        </form>
      </section>

      <aside class="config" aria-label="Live config from LaunchDarkly">
        <h2>Live config</h2>
        <p class="config-source">What LaunchDarkly serves this session, right now.</p>
        <ol id="ladder" class="ladder"></ol>
        <dl id="config-card" class="config-card">
          <dt>Variation</dt>
          <dd id="config-variation">…</dd>
          <dt>Model</dt>
          <dd id="config-model">…</dd>
          <dt>Prompt</dt>
          <dd id="config-prompt" class="config-prompt">…</dd>
          <dt>Tools</dt>
          <dd id="config-tools">…</dd>
        </dl>
        <section id="booking" class="booking" hidden>
          <h3>Booked</h3>
          <p id="booking-summary"></p>
        </section>
      </aside>
    </main>

    <p id="boothstrap-state" class="visually-hidden"></p>
  </body>
</html>
